[project]
name = "anomaly-detection"
version = "0.1.0"
description = "Laboratoare Detecția Anomaliilor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "combo>=0.1.3",
    "matplotlib>=3.9.0",
    "pyod>=3.6.6",
    "scikit-learn>=1.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
